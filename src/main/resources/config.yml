# RealDualWield configuration
#
# Reload it with /rdwreload

# Internal: do not touch. It is only used to update the defaults of an existing configuration
# when the plugin changes them.
config-version: 2

# Shows the cooldown bar (title) while the off-hand weapon is recharging.
show-cooldown-bar: true

# Allows hitting a mob that is standing in the air.
can-attack-mob-in-air: false

# Blocks the off-hand attack when the right click is held down for too long.
deny-longpress-rightclick: true

# Lets the off-hand weapon break plants instantly.
break-plants: true

# Plays the off-hand animation even when the off-hand is empty.
break_plants_bare_hand: true

# How the off-hand swing animation is produced.
#
#   auto   - (default) send the animation packet through ProtocolLib when it can be created,
#            otherwise use LivingEntity#swingOffHand() (Paper / Purpur).
#   packet - only send the animation packet (ProtocolLib). On Minecraft 26.x the packet is an
#            immutable record, so it is created by reflection and then handed to ProtocolLib.
#            If anything fails the plugin still falls back to the API.
#   api    - only use LivingEntity#swingOffHand(), no packet is ever created. Recommended if
#            you do not run ProtocolLib or if another plugin conflicts with the animation packet.
offhand-animation-method: auto

# Prints in the console what the plugin is doing and, above all, *why* an off-hand attack is
# skipped. Enable it, hit a mob with the off-hand and read the lines starting with
# [RealDualWield][debug] if something does not work. Turn it off once you are done: it is chatty.
debug: false

# Nexo support: when the main hand holds a Nexo block the right click places it, so the off-hand
# swing is skipped, exactly like for vanilla blocks.
#
#   block - (default) skip the swing only for Nexo custom blocks
#   item  - skip the swing for every Nexo item held in the main hand
#   false - never check Nexo
nexo-check: block

# Off-hand swing animation. Since Minecraft 26.1 the length (and the shape, whack/stab) of the
# swing animation is the "minecraft:swing_animation" data component of the item being swung, and
# the client falls back on a flat 6 ticks when the item does not carry it: MMOItems weapons, built
# on a vanilla material, never carry it and therefore all swing in the same way.
#
#   auto  - duration = 10 / attack-speed ticks, i.e. half of the recharge time of the weapon:
#           6 ticks for a 1.6 atk/s sword (the vanilla default), up to 20 (1s) for a greatsword.
#           Written only on the items that do not define the component yet: nothing else of the
#           item is touched, textures included.
#   <n>   - always use n ticks (es. offhand-swing-animation: 12)
#   none  - never touch the item (the animation is always the vanilla default of 6 ticks)
offhand-swing-animation: auto

# Knockback applied by the off-hand attack. Keep it off: on MMOItems/MMOCore servers the
# knockback belongs to the combat system of those plugins.
offhand-knockback: false

# A mob hit by the main hand is invulnerable for 10 ticks (0.5s) and vanilla drops every damage
# that is not higher than the previous one during that window: with this option the off-hand hit
# right after a main hand hit lands anyway (the invulnerability is cleared before dealing it).
# Set it to false if you prefer the vanilla rule (the off-hand only adds the difference).
offhand-ignore-no-damage-ticks: true

# Minimum time (in ticks) between two hits, WHICHEVER hand deals them: the off hand waits after a
# main hand hit and the main hand waits after an off-hand hit. It is the anti "left click + right
# click together = instant double damage" guard: the combo main -> off -> main is still possible,
# but every hit needs its own click.
#   8  (default) 0.4s  - a quick 1-2 combo, impossible to do in a single frame
#   10          0.5s  - the vanilla invulnerability window (only the damage difference lands)
#   0                  - no delay at all (not recommended: it is a huge DPS cheat)
offhand-delay-after-main-hand: 8

# ---------------------------------------------------------------------------
# MMOItems / MMOCore
# ---------------------------------------------------------------------------
mmoitems:

  # Master switch. With false the plugin ignores MMOItems/MMOCore completely.
  enabled: true

  # Two Handed weapons (the very same check MMOItems does before using a weapon):
  #   * a two handed weapon in the OFF hand never attacks: no damage, no knockback,
  #     no animation, no mana spent;
  #   * a two handed weapon in the MAIN hand disables both hands (see below).
  # Catalysts (items with the "Handworn" stat) never count as the second item.
  two-handed: true

  # Blocks a two handed weapon held in the off hand even when the main hand is empty.
  block-two-handed-off-hand: true

  # While the hands are "too charged", also cancel the attacks of the main hand, so that holding
  # a two handed weapon plus another weapon does not work at all (MMOItems' item restriction).
  cancel-main-hand-attack: true

  # Applies the Mana Cost / Stamina Cost of the off-hand weapon, exactly like MMOItems does.
  # Needs MMOCore: with MMOItems alone the cost is ignored.
  apply-weapon-costs: true

  # Tells the player when he does not have enough mana/stamina for the off-hand weapon.
  notify-not-enough-mana: true
  not-enough-mana-message: '&cNot enough mana!'
  not-enough-stamina-message: '&cNot enough stamina!'

  # Uses the MMOItems attack speed of the off-hand weapon as cooldown instead of 12 ticks
  # (20 / attacks-per-second, i.e. exactly the recharge time of the weapon in the main hand,
  # clamped between min-cooldown and max-cooldown).
  # max-cooldown is 200 ticks = 10 seconds: keep it high or slow weapons (a greatsword with
  # 0.2 attacks/sec needs 100 ticks = 5s) would be cut short.
  use-attack-speed: true
  min-cooldown: 4
  max-cooldown: 200

  # While that cooldown runs the off-hand attack is skipped altogether (instead of only being
  # scaled down), so the weapon really attacks at the speed MMOItems gives it.
  enforce-cooldown: true

  # The attack damage of an MMOItems weapon is read from the item (the vanilla item attributes are
  # empty since MMOItems 6.7). With this option the plugin also adds, on top of it, its own critical
  # hits and Sharpness scaling: set it to false to leave all of that to MMOItems/MythicLib (useful
  # if you see the numbers inflated, e.g. critical hits counted twice).
  apply-crit-and-enchants: true

  # Every MMOItems weapon can be used in the off hand even when its vanilla material is not
  # listed in dual_wield_enabled.materials below. Needed for textured weapons based on paper,
  # sticks, bones... (custom model data / itemsadder / Nexo textures keep working: the plugin
  # never modifies the item).
  all-mmoitems-weapons: true

  # Applies the vanilla durability loss to MMOItems items. Leave it on false: MMOItems has its
  # own durability system and changing the item damage breaks "texture by durability" items.
  apply-durability: false

# Materials that can be used as an off-hand weapon.
dual_wield_enabled:
