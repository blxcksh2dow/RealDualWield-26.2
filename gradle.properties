# Plugin version baked into plugin.yml
pluginVersion=1.12.0

# Minecraft / Paper 26.2 API (Purpur, Pufferfish, Leaf... all expose the same API artifact)
paperApiVersion=26.2-R0.1-SNAPSHOT

# ProtocolLib is only needed at compile time: the plugin also works without it at runtime.
# Any ProtocolLib build supporting 26.2 works (5.5.0-SNAPSHOT / latest dev build).
protocolLibVersion=5.4.0

# Minecraft 26.2 servers run on Java 25
targetJavaVersion=25

org.gradle.parallel=true
org.gradle.caching=true
